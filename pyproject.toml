[project]
name = "canvas-reader"
version = "0.1.0"
description = "Sync Canvas LMS courses (wiki pages + PDF textbooks) to local Markdown and PDF files that you and AI agents can read."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "DTA Projects" }]
requires-python = ">=3.11"
keywords = ["canvas", "lms", "instructure", "opencode", "markdown", "study"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.31",
    "markdownify>=0.13,<2",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.6",
]

[project.scripts]
canvas = "canvas_reader.cli:main"

[project.urls]
Homepage = "https://github.com/DTA-Projects/canvas-reader"
Issues = "https://github.com/DTA-Projects/canvas-reader/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_reader"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
